# 项目二试录：在桌上抓药盒、放进收纳盒。只用来跑通流程，正式数据另录。
#
# 用法（在商家 LeRobot 的虚拟环境里，在本仓库根目录运行）：
#   V=~/nexarm-teleop-latency/vendor-nexarm/finsh/.venv/bin/python
#   $V scripts/check_setup.py                                   # 先做开工检查
#   $V -m lerobot.scripts.lerobot_record --config_path=configs/record_pilot.yaml
#
# 按键（全局监听，不用切到终端窗口）：
#   →   录制中：这条做完了，提前结束，进入复位；复位中：准备好了，提前开始下一条
#   ←   这条作废，进入复位后重录
#   Esc 停止（只在复位时间里按：每条是在它后面的复位结束时才保存的，录制中按会把录了一半的这条也存进去）
#
# 每一条的做法：
#   复位时：把药盒放到起点区的新位置（换位置和朝向），把从臂带到起始姿势，扶稳主臂，按 →
#   录制时：夹药盒 → 抬起 → 放进收纳盒 → 回到起始姿势 → 按 →（不按就等 20 秒到）
#   程序一启动就直接开始录第 0 条，这时手臂还在休息姿势。先按一次 ←，就进入复位，按上面的做法开始。
#
# 收尾：程序结束时会关掉从臂的力矩，手臂悬空的话会直接掉下来。
# 所以 num_episodes 比计划多设 1 条：第 10 条录完进入复位后，用主臂把从臂放到休息姿势，
# 再按 Esc。第 10 条照常保存，第 11 条不会开始。
#
# 开始时从臂一上力矩就会以较快速度转到主臂的姿势，所以启动前先把主臂摆成和从臂差不多的姿势
# （scripts/check_setup.py 会提示两者差多少）。

robot:
  type: nexarm_follower
  port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:4.4:1.0-port0  # 从臂，主板 4.4 号口
  baudrate: 1000000
  cameras:
    # 相机 fps 只能写 30：LeRobot 会核对相机报告的帧率，支架相机在这个分辨率下只接受 30。
    # 实际出帧：支架相机约 20 帧；手臂相机看光线，暗时 10–15 帧、够亮约 23 帧。
    front:  # 支架相机。640×360 保留完整广角；640×480 会把左右各裁掉约 12%
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-icSpring_icspring_camera_202404160005-video-index0
      width: 640
      height: 360
      fps: 30
      fourcc: MJPG
      backend: 200  # V4L2
    wrist:  # 手臂相机，只支持 YUYV 640×480
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-icSpring_icspring_camera-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: YUYV
      backend: 200

teleop:
  type: nexarm_leader
  port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:11:1.0-port0  # 主臂，主板 11 号口
  baudrate: 1000000

dataset:
  repo_id: local/nexarm_medbox_bin_pilot
  root: data/pilot
  single_task: "Pick up the medicine box and put it in the bin."  # π0.5 会读这句话，药盒和收纳盒用不同的词
  num_episodes: 11  # 计划 10 条，第 11 条只用它前面的复位时间收臂，见文件开头
  episode_time_s: 20  # 实测抓放 8–15 秒，加上回到起始姿势
  reset_time_s: 30  # 上限；准备好就按 → 提前开始
  # 录制频率，也是录制时的遥操作控制频率（项目一是 50 Hz）。
  # 实测（两个相机同时开，按这个频率取最新帧）：20 Hz 时支架相机只有 82% 是新帧，15 Hz 时 100%。
  fps: 15
  video: true
  push_to_hub: false

display_data: false
play_sounds: true
