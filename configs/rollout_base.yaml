# 让训练好的策略在真机上自己跑一次（LeRobot 的 lerobot-rollout，base 模式：不录数据）。
#
# 用法（在本仓库根目录；先跑 scripts/check_setup.py 设好相机曝光）：
#   V=~/nexarm-teleop-latency/vendor-nexarm/finsh/.venv/bin/python
#   $V -m lerobot.scripts.lerobot_rollout --config_path=configs/rollout_base.yaml \
#      --policy.path=outputs/train/act_medbox_45ep/checkpoints/025000/pretrained_model
#
# 开始前：从臂要已经停在起始姿势（用 configs/teleop_practice.yaml 带过去再退出，力矩保持），药盒放进起点区。
# 程序启动后策略立刻接管从臂，跑 duration 秒；结束时从臂用 3 秒平滑回到启动时的姿势（起始姿势），保持力矩。
# 相机、分辨率、帧率必须和录数据时一样。

robot:
  type: nexarm_follower
  port: /dev/serial/by-path/pci-0000:00:14.0-usb-0:4.4:1.0-port0  # 从臂，主板 4.4 号口
  baudrate: 1000000
  disable_torque_on_disconnect: false  # 程序退出（包括出错）时保持力矩，从臂不会掉
  cameras:
    # 相机 fps 只能写 30：LeRobot 会核对相机报告的帧率，支架相机在这个分辨率下只接受 30。
    # 实际出帧：支架相机约 20 帧；手臂相机看光线，暗时 10–15 帧、够亮约 23 帧。
    front:  # 支架相机。640×360 保留完整广角；640×480 会把左右各裁掉约 12%
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-icSpring_icspring_camera_202404160005-video-index0
      width: 640
      height: 360
      fps: 30
      fourcc: MJPG
      backend: 200  # V4L2
    wrist:  # 手臂相机，只支持 YUYV 640×480
      type: opencv
      index_or_path: /dev/v4l/by-id/usb-icSpring_icspring_camera-video-index0
      width: 640
      height: 480
      fps: 30
      fourcc: YUYV
      backend: 200

strategy:
  type: base

fps: 15  # 和录数据一样
duration: 25  # 示范平均 17 秒，留余量；时间到了还没做完，回起始姿势时可能蹭到收纳盒
task: "Pick up the medicine box and put it in the bin."
return_to_initial_position: true
play_sounds: true
